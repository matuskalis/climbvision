  <text class="ink sans" x="340.0" y="444" font-size="21">Frame 24 is at <tspan class="blue" font-weight="700">1.867 s</tspan> in the container and at <tspan class="red" font-weight="700">1.748 s</tspan> by frame number / rate: 119 ms apart.</text>
  <text class="muted sans" x="56.0" y="494" font-size="17" font-weight="700" letter-spacing="1">QUALITY FLAGS, NOT REJECTIONS</text>
  <text class="muted mono" x="1144.0" y="494" font-size="15" text-anchor="end">this clip is outside the envelope on purpose; the run still exited 0</text>
