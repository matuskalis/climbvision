<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 764" width="1200" height="764" role="img" aria-labelledby="t d">
  <title id="t">27 frames, two clocks</title>
  <desc id="d">27 frames of a synthetic variable-frame-rate clip, placed at their container timestamps and at frame number divided by the average frame rate. The worst disagreement is 119 ms.</desc>
  <style>
  :root {
    --ground: #f1f3f2; --ink: #14181b; --muted: #57626a; --blue: #1f4fd8;
    --red: #c9252d; --ok: #0b6f5f; --link: #b4bdc2;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ground: #0f1316; --ink: #e9eef1; --muted: #9aa6ad; --blue: #7aa2ff;
      --red: #ff7b72; --ok: #4fd1b5; --link: #3a454c;
    }
  }
  .ground { fill: var(--ground); }
  .ink { fill: var(--ink); }
  .muted { fill: var(--muted); }
  .blue { fill: var(--blue); }
  .red { fill: var(--red); }
  .ok { fill: var(--ok); }
  .sans { font-family: 'Avenir Next Condensed', 'Arial Narrow', 'Roboto Condensed', 'Helvetica Neue', Arial, sans-serif; }
  .mono { font-family: ui-monospace, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
  .link { stroke: var(--link); stroke-width: 1.5; }
  .focus { stroke: var(--ink); stroke-width: 3; }
  .axis { stroke: var(--ink); stroke-width: 2; }
</style>
  <rect class="ground" width="1200" height="764"/>
  <text class="ink sans" x="56.0" y="100" font-size="56" font-weight="800">27 frames, two clocks</text>
  <text class="muted sans" x="56.0" y="138" font-size="21">A real ingest of a synthetic clip whose frames were dropped on purpose. Drawn from the files it wrote.</text>
  <text class="muted mono" x="1144.0" y="100" font-size="16" text-anchor="end">climbvision ingest vfr_160x120_2s.mp4</text>
  <text class="blue sans" x="56.0" y="206" font-size="19" font-weight="700" letter-spacing="1">CONTAINER TIMESTAMPS</text>
  <text class="muted sans" x="56.0" y="228" font-size="17">recorded as integer ticks</text>
  <text class="muted sans" x="56.0" y="250" font-size="17">of 1/15360 s</text>
  <text class="red sans" x="56.0" y="310" font-size="19" font-weight="700" letter-spacing="1">FRAME NUMBER ÷ AVG RATE</text>
  <text class="muted sans" x="56.0" y="332" font-size="17">810/59 fps as reported</text>
  <text class="muted sans" x="56.0" y="354" font-size="17">never used for time</text>
