  <text class="muted mono" x="898.0" y="578" font-size="16">27 of 27 packets</text>
  <text class="muted sans" x="56.0" y="628" font-size="17" font-weight="700" letter-spacing="1">WHAT THE RUN WROTE</text>
  <text class="muted mono" x="1144.0" y="628" font-size="15" text-anchor="end">4 hashes re-computed from the files on disk: all match</text>
  <text class="ink mono" x="56.0" y="658" font-size="16">asset_id</text>
  <text class="ink mono" x="280.0" y="658" font-size="16" font-weight="700">a303e1847f4c…</text>
  <text class="muted mono" x="480.0" y="658" font-size="16">sha256 of the file bytes, so a rename changes nothing</text>
  <text class="ink mono" x="56.0" y="682" font-size="16">recording.json</text>
  <text class="ink mono" x="280.0" y="682" font-size="16" font-weight="700">883cd1a6e028…</text>
  <text class="muted mono" x="480.0" y="682" font-size="16">canonical JSON, byte-identical on every re-ingest</text>
  <text class="ink mono" x="56.0" y="706" font-size="16">frame_index.json</text>
  <text class="ink mono" x="280.0" y="706" font-size="16" font-weight="700">993538ea1cbc…</text>
  <text class="muted mono" x="480.0" y="706" font-size="16">hash kept in the manifest, ticks sorted by PTS</text>
  <text class="ink mono" x="56.0" y="730" font-size="16">runs/run-&lt;id&gt;.json</text>
  <text class="ink mono" x="280.0" y="730" font-size="16" font-weight="700">append-only</text>
  <text class="muted mono" x="480.0" y="730" font-size="16">names manifest, config, ffprobe 8.0 and raw probe output by hash</text>
