[project]
name = "climbvision"
version = "0.1.0"
description = "Computer-vision telemetry for indoor bouldering. Stage 1: deterministic, content-addressed recording manifests."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Matúš Kališ" }]
keywords = ["bouldering", "telemetry", "provenance", "content-addressed", "video"]
classifiers = [
  "Development Status :: 1 - Planning",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3.11",
  "Private :: Do Not Upload",
]
# Stage 1 turns a video file into a manifest and nothing else: no pose, no hold detection, no
# calibration, no web layer, no models. Pydantic is the only runtime dependency; ffprobe is an
# external tool invoked as a subprocess, not a Python package.
dependencies = ["pydantic>=2.7,<3"]

[project.scripts]
climbvision = "climbvision.cli:main"

[dependency-groups]
dev = ["mypy>=2,<3", "pytest>=8,<9", "ruff>=0.6,<1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/climbvision"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
files = ["src", "scripts"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
